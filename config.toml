# Couvre-feu tuning. Loaded once at startup.
# Map size and layout live in curfew.py: the streets and roads are placed by hand.

[screen]
width = 1024
height = 768
zoom = 2.2               # world is drawn at width/zoom x height/zoom, then scaled up

[feel]
camera_lag = 6           # lerp rate (1/s) of the camera following the player; higher = snappier
accel = 10               # lerp rate (1/s) of player speed changes; higher = snappier

[player]
# speed in px/s; vis multiplies every cop's detection radius
walk      = { speed = 85,  vis = 1.0 }
sneak     = { speed = 45,  vis = 0.6 }
sprint    = { speed = 145, vis = 1.4 }
exhausted = { speed = 60,  vis = 1.2 }   # wheezing loudly
lit_vis = 1.8            # extra vis multiplier when standing under a street light
wading = 0.5             # speed multiplier in the barrage water

[stamina]
sprint_secs = 10         # full bar lasts 10 s of sprint
refill_secs = 60         # 60 s to refill from empty
recover_at = 0.25        # once emptied, no sprinting until the bar is back to 25%

[shelter]
knock_secs = 1.5
shelter_secs = 6
chance = 0.85           # odds the owner lets you in

[night]
darkness = 242           # alpha of the night overlay (0-255)
lamp_radius = 120
lamp_color = [255, 170, 70]      # warm sodium glow
torch_color = [130, 140, 190]    # cold white police torches / headlights
player_light = 60                # not a light source: just your eyes adjusting to the dark
player_light_strength = 110      # 0-255, how much of the darkness it lifts
player_light_color = [60, 80, 140]

[trip]
# Start and home are re-rolled every run, always roughly this far apart (tiles, as the crow flies).
min_dist = 200
max_dist = 240

[police]
foot_cops = 252          # same density as the old 90x70 map
bikes_per_road = 3

[police.posted]
# Some foot cops stand at a post and don't move until they spot you; after a chase they walk back to it.
share = 0.3
chatty = 0.5             # share of posted cops muttering to themselves: you overhear them when you get close
hear_dist = 150          # px
line_secs = 4            # each line stays this long, then they move on to the next
lines = [
    "La go d'hier la avait cui... Mais j'ai pas pu chop",
    "Fabrice meme est trop bete quoi...",
    "On me paie meme pas bien",
    "Ce couvre-feu là, c'est nous-mêmes on souffre.",
    "Le chef dort dans la voiture, et moi je suis debout ici...",
    "Wallaye j'ai faim. Même un pain sec là...",
    "Après le service, direct au maquis.",
    "Si je chope quelqu'un ce soir, son portable c'est pour moi.",
]

# radius: how far they SEE you (px, drawn as a ring, scaled by your vis)
# light: radius of their torch, shone ahead of them; it lights the street, it is not their sight
# speed: px/s, color: uniform RGB
[police.types.Agent]
radius = 110
light = 70
speed = 95
color = [40, 70, 160]

[police.types.Gendarme]  # big torch, slow
radius = 170
light = 110
speed = 70
color = [30, 100, 60]

[police.types.Motard]    # motorbike patrols on the asphalt only (name used by the code: keep it)
radius = 85
light = 120              # headlight
speed = 175
color = [210, 210, 210]

[police.types."Gros Chef"]  # barely sees, barely moves
radius = 60
light = 40
speed = 45
color = [120, 70, 30]

[home]
lamp_color = [255, 40, 30]   # the red lamp over your own gate: the only way to tell it apart
lamp_radius = 70

[textures]
# Optional image files, relative to the game folder (put them in assets/). Empty = built-in drawing.
# See assets/README.md for what each one is and the size it is drawn at.
ground = "assets/ground.png"
yard = "assets/yard.png"
road = "assets/road.png"
water = "assets/water.png"
grass = "assets/grass.png"
house = "assets/house.png"               # roof, tinted per house with the house palette (so use a light, greyish image)
wall_high = "assets/wall_high.png"
wall_low = "assets/wall_low.png"
wall_glass = "assets/wall_glass.png"
gate = "assets/gate.png"                # drawn for an east-west wall; rotated for north-south ones
bin = "assets/bin.png"
lamp = "assets/lamp.png"
player = "assets/player.png"
djinn = "assets/djinn.png"
djinn_eyes = "assets/djinn_eyes.png"   # just the glowing eyes, drawn over the darkness
cop = ""                 # every police type...
cop_Agent = "assets/cop_Agent.png"           # ...unless it has its own
cop_Gendarme = "assets/cop_Gendarme.png"
cop_Motard = "assets/cop_Motard.png"
"cop_Gros Chef" = "assets/cop_Gros Chef.png"

[debug]
show_sight = false       # draw each cop's detection ring (the real catch range, scaled by your vis)

[dialogue]
# Skinning: leave paths empty for the mock look. Paths are relative to the game folder.
font = ""                # .ttf/.otf file; empty = system font
font_size = 18
box_texture = ""         # image stretched behind the dialogue box; empty = flat translucent box
chars_per_sec = 45       # typewriter speed
hold_secs = 1.8          # a line stays this long once fully typed, then the next one starts

[dialogue.avatars]
# speaker name = "path/to/portrait.png"; speakers without one get a placeholder face
# "Tantie Rasmata" = "assets/rasmata.png"

[dialogue.owner]
names = ["Tonton Issouf", "Tantie Rasmata", "Le vieux Sawadogo", "Maman Awa", "Monsieur Ouédraogo", "Tantie Bintou"]
# Each reply is one line or a list of lines played in a row.
refuse = [
    "Ton maudia!",
    "Va-t'en! On dort ici.",
    ["Qui frappe comme ça à cette heure?", "Dégage avant que j'appelle les corps habillés!"],
    "Hé, c'est pas un maquis ici!",
    ["Mon fils, je te connais pas.", "Et je veux pas te connaître."],
]
accept = [
    ["Ah boss, tu fous quoi dehors à cette heure?", "Entre vite, avant qu'ils te voient."],
    "Entre vite!",
    ["Encore toi? Ta maman sait que tu traînes?", "Bon, rentre. Mais tu enlèves tes chaussures."],
    ["Chut! Les enfants dorment.", "Assieds-toi là, et pas un bruit."],
]
leave = ["Allez, file maintenant!", "Bon, la route est libre. Va doucement!", "Dieu te garde. Et ne reviens pas."]
# narrator lines when knocking again on a house that already sheltered you
used = ["Déjà fait. Ils font semblant de dormir.", "La lumière s'éteint. Message reçu."]

[lots]
# Ouaga-style parcelles: blocks of 3x2 walled lots, each a yard with the house in the middle and a gate on the street.
vacant = 0.08            # share of lots left as open ground (terrain vague)
small_house = 0.25       # share of houses that are a 2x1 banco hut instead of 2x2

[walls]
# One look per lot, picked by weight. Walls cannot be climbed.
[walls.kinds.high]       # tall concrete
weight = 2
[walls.kinds.low]        # crumbly banco bricks
weight = 3
[walls.kinds.glass]      # banco topped with broken bottles and iron spikes
weight = 2

[djinns]
# Spirits wandering the night, placed anew every run. They all look alike: talking to one (hold E)
# is a gamble, the reply decides. Each speaks once, then vanishes.
count = 30
talk_secs = 1.0
generous = 0.5           # odds the djinn gives a gift rather than a curse
names = ["Kinkirga", "Le Djinn du carrefour", "La Dame en blanc", "Le Vieux sans ombre", "L'Enfant aux pieds tournés"]
gifts = [["invisible", 5], ["jambes_de_feu", 20], ["recharge", 3]]     # [effect, seconds], one picked
curses = [["lourdeur", 25], ["poisse", 30]]
gift_lines = [
    ["Tu marches dans ma nuit, petit... Mais tu as du respect.", "Prends ça, et file."],
    ["Ta grand-mère m'a offert du dolo, un jour.", "Je te rends la politesse."],
    "Va en paix. La nuit te porte.",
]
curse_lines = [
    ["Tu ne m'as même pas salué?", "Grave erreur."],
    ["Qui t'a dit de passer par ici?", "Maintenant, tu portes ma poussière."],
    "Hé hé hé... Bonne chance, petit.",
]
vanish = "Le djinn s'évapore dans la nuit."

[bins]
count = 350              # trash bins scattered along the walls, re-rolled every run
search_secs = 1.5        # hold E this long to rummage through one
chance = 0.4             # odds a bin holds an item; each bin can be searched once
found = "Au fond de la poubelle: {item}!"
empty = ["Rien. Juste des épluchures de mangue.", "Un vieux sachet de pure water. Vide.", "Des os de poulet bicyclette, déjà rongés."]

# Effects items can apply, for a number of seconds. Each has a name for the HUD and any of:
#   stamina_per_sec: share of the stamina bar added every second, even while sprinting
#   refill_mult:     multiplies the normal stamina refill speed
#   speed_mult:      multiplies your movement speed
#   sprint_mult:     multiplies your speed while sprinting only
#   invisible:       true = the police can't see you (nor catch you)
# Active effects stack: multipliers multiply, per-second gains add.
[effects.recharge]
name = "Recharge"
stamina_per_sec = 0.20
[effects.second_souffle]
name = "Second souffle"
refill_mult = 1.3
[effects.lourdeur]
name = "Lourdeur"
speed_mult = 0.9
[effects.invisible]
name = "Invisible"
invisible = true
[effects.jambes_de_feu]
name = "Jambes de feu"
sprint_mult = 1.3
[effects.poisse]
name = "Poisse"
refill_mult = 0.5

# Items found in bins. weight: relative odds when a bin has something.
# effects: [effect, seconds] pairs applied when you drink it.
[items."Boisson X-Plus"]
weight = 2
effects = [["recharge", 2], ["second_souffle", 20]]
use = "Glou glou... Ça fouette! T'es reparti."

[items."Coca Cola"]
weight = 3
effects = [["second_souffle", 40], ["lourdeur", 15]]
use = "Pschhh... Glou glou. Le sucre monte, le ventre aussi."

[items.Storm]
weight = 2
effects = [["recharge", 4], ["lourdeur", 20]]
use = "Ça tape au cœur. Tu vois des couleurs."
